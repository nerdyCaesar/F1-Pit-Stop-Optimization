<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>F1 Pit Stop Optimizer</title>

    <meta
        name="description"
        content="This is a project that uses machine learning to predict whether an Formula 1 driver should make a pit stop on their next lap."
    >

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --red: #e10600;
            --dark: #0b0b0f;
            --dark-card: #15151d;
            --gray: #a8a8b3;
            --white: #f5f5f5;
            --border: #292933;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: var(--dark);
            color: var(--white);
            line-height: 1.6;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        section {
            max-width: 1100px;
            margin: auto;
            padding: 80px 24px;
        }

        .section-label {
            color: var(--red);
            font-size: 13px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 12px;
        }

        h2 {
            font-size: 40px;
            letter-spacing: -1.5px;
            margin-bottom: 20px;
        }

        .section-description {
            color: var(--gray);
            max-width: 720px;
            margin-bottom: 40px;
        }
    </style>
</head>

<body>

</body>
</html>
